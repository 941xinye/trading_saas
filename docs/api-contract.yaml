    ParameterOptimizationStore:
      type: object
      required: [strategy_code, symbol, interval, from_utc, to_utc, grid]
      properties:
        strategy_code:
          type: string
          description: 必须是 config('backtest.strategies') 中的策略码
        symbol:
          type: string
          maxLength: 20
          pattern: "^[A-Z0-9]{2,20}$"
        interval:
          type: string
          enum: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]
        from_utc:
          type: string
          format: date
        to_utc:
          type: string
          format: date
          description: 必须晚于 from_utc
        grid:
          type: object
          minProperties: 1
        base_params:
          type: object
        mode:
          type: string
          enum: [grid, walk_forward]
          default: grid
        folds:
          type: integer
          minimum: 2
          maximum: 52
          default: 3
        objective:
          type: string
          description: 必须是 config('optimization.objectives') 中的目标
          default: total_return_pct
        top_n:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
        fee_rate:
          type: number
          minimum: 0
          maximum: 0.01
        slippage_bps:
          type: integer
          minimum: 0
          maximum: 100
        initial_capital:
          type: number
          exclusiveMinimum: 0
